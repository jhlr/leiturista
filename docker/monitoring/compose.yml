# Ambiente de MONITORAMENTO. Subir com `just up-monitoring` (cria a rede `luminus-net`; independe da inferencia).
# Le o log por montagem SOMENTE LEITURA e raspa o /metrics da inferencia pela rede; nunca escreve em serving-logs.
name: leiturista-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [luminus-net]

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [luminus-net]

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ../../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../../serving-logs:/serving-logs:ro
      - alloy-data:/var/lib/alloy/data  # posicoes de leitura por arquivo (evita reler o que ja foi enviado)
    depends_on: [loki]
    networks: [luminus-net]

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Infinity le as rotas /data/* do `monitor`; Business Charts (ECharts) desenha os box plots (o Grafana nao tem box plot nativo).
      # Os plugins sao baixados do grafana.com na primeira subida (precisa de internet) e ficam no volume grafana-data.
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.5,volkovlabs-echarts-panel@7.2.5
    ports:
      - "3001:3000"
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, monitor]
    networks: [luminus-net]

  monitor:
    image: leiturista-monitor:0.1.0
    build:
      context: ../..
      dockerfile: docker/monitoring/Dockerfile.monitor
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-unknown}
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DRIFT_WINDOW_IMAGES: ${DRIFT_WINDOW_IMAGES:-100}
    ports:
      - "3002:3000"
    volumes:
      - ../../serving-logs:/serving-logs:ro
      - ../../artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:3000/readyz', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks: [luminus-net]

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  luminus-net:
    external: true
