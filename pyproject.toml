[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leiturista"
version = "0.1.0"
description = "Leiturista - visao computacional de medidores: leitura OCR + serial + validacao de cena (Projeto 4 / distribuidoras de energia eletrica)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "datasets",
    "accelerate",
    "sentencepiece",
    "tokenizers",
    "pandas",
    "pyarrow",
    "duckdb",
    "pillow",
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "mlflow",
    "streamlit",
]

[project.scripts]
leiturista = "leiturista.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
